<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback · SMH GI Surgery Journal Club</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --nhs-blue:#003087; --nhs-bright:#005eb8; --cyan:#41b6e6; --bg:#0f0f1a; --card:rgba(255,255,255,0.04); --border:rgba(255,255,255,0.09); }
body { background:var(--bg); color:#fff; font-family:Arial,'Helvetica Neue',Helvetica,sans-serif; line-height:1.5; }
.wrap { max-width:640px; margin:0 auto; padding:0 0 60px; }
.hero { background:linear-gradient(145deg,#003087 0%,#001a4d 60%,#0a0a18 100%); padding:40px 32px 34px; text-align:center; }
.hero img { height:52px; width:auto; filter:brightness(0) invert(1); opacity:0.95; display:block; margin:0 auto 16px; }
.overline { font-size:11px; font-weight:700; letter-spacing:0.22em; text-transform:uppercase; color:var(--cyan); margin-bottom:12px; }
.hero-title { font-size:32px; font-weight:700; letter-spacing:-1px; }
.hero-sub { font-size:15px; color:rgba(255,255,255,0.55); margin-top:8px; }
.accent-bar { height:3px; background:linear-gradient(90deg,var(--cyan),var(--nhs-blue),transparent); }
.section { padding:26px 32px 0; }
.form-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:24px 22px; }
.q { padding:14px 0; border-bottom:1px solid var(--border); }
.q:last-of-type { border-bottom:none; }
.q .qt { font-size:14px; font-weight:600; margin-bottom:10px; }
.stars { display:flex; gap:8px; }
.star { flex:1; max-width:56px; height:40px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; font-weight:700; color:rgba(255,255,255,0.65); }
.star.sel { background:var(--nhs-bright); border-color:var(--nhs-bright); color:#fff; }
.scale { display:flex; justify-content:space-between; font-size:11px; color:rgba(255,255,255,0.4); margin-top:6px; }
.field { margin-top:16px; }
.field label { display:block; font-size:13px; font-weight:700; color:rgba(255,255,255,0.8); margin-bottom:6px; }
.field textarea, .field input, .field select { width:100%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14); border-radius:8px; padding:10px 12px; color:#fff; font-size:14px; font-family:inherit; }
.field textarea { resize:vertical; min-height:60px; }
.field select option { background:#12122a; }
.row2 { display:flex; gap:14px; } .row2 .field { flex:1; }
.btn { width:100%; background:linear-gradient(135deg,var(--nhs-bright),var(--nhs-blue)); color:#fff; border:none; border-radius:8px; padding:15px; font-size:15px; font-weight:700; cursor:pointer; margin-top:18px; }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
.msg { margin-top:14px; font-size:14px; border-radius:8px; padding:12px 14px; display:none; }
.msg.err { display:block; background:rgba(218,41,28,0.14); border:1px solid rgba(218,41,28,0.4); color:#fca5a5; }
.success { display:none; text-align:center; padding:16px 4px; }
.success .tick { width:56px; height:56px; border-radius:50%; margin:0 auto 16px; background:rgba(0,153,80,0.15); border:2px solid rgba(0,153,80,0.5); display:flex; align-items:center; justify-content:center; font-size:28px; color:#4ade80; }
.success h3 { font-size:20px; margin-bottom:8px; }
.success p { color:rgba(255,255,255,0.6); font-size:14px; }
.anon { font-size:12px; color:rgba(255,255,255,0.4); text-align:center; margin-top:12px; }
.foot { padding:26px 32px 0; text-align:center; font-size:12px; color:rgba(255,255,255,0.35); }
.foot a { color:var(--cyan); text-decoration:none; }
@media (max-width:560px){ .hero-title{font-size:26px;} .row2{flex-direction:column;gap:0;} .section,.hero,.foot{padding-left:20px;padding-right:20px;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <img src="logo_transparent.png" alt="Southmead Surgical Teaching">
    <div class="overline">GI Surgery Journal Club</div>
    <div class="hero-title">How did we do?</div>
    <div class="hero-sub">Two minutes of anonymous feedback — it shapes the next one</div>
  </div>
  <div class="accent-bar"></div>

  <div class="section">
    <div class="form-card">
      <form id="fbForm">
        <div id="ratings"></div>

        <div class="field"><label for="liked">What worked well?</label><textarea id="liked"></textarea></div>
        <div class="field"><label for="improve">What could we improve, or topics for next time?</label><textarea id="improve"></textarea></div>

        <div class="row2">
          <div class="field"><label for="role">Your role <span style="font-weight:400;color:rgba(255,255,255,0.4);">(optional)</span></label>
            <select id="role"><option value="">Prefer not to say</option><option>Resident</option><option>Consultant</option><option>Other</option></select></div>
          <div class="field"><label for="grade">Grade <span style="font-weight:400;color:rgba(255,255,255,0.4);">(optional)</span></label><input type="text" id="grade" placeholder="e.g. ST5"></div>
        </div>

        <button type="submit" class="btn" id="submitBtn">Submit feedback</button>
        <div class="msg" id="msg"></div>
        <div class="anon">Anonymous — we don't ask for your name or email.</div>
      </form>

      <div class="success" id="success">
        <div class="tick">✓</div>
        <h3>Thank you</h3>
        <p>Your feedback helps us make the next journal club better.</p>
      </div>
    </div>
  </div>
  <div class="foot"><a href="journal_club.html">← Back to the Journal Club</a></div>
</div>

<script>
(function () {
  var SUPABASE_URL = 'https://rufihxjquwrluaenmbaa.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1ZmloeGpxdXdybHVhZW5tYmFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyOTg4NDMsImV4cCI6MjA5Mzg3NDg0M30.6o8GrCPcQ__JjrGLUiqQwdgWcM1Qk_02TvLvTOwUjyg';

  var QS = [
    { key: 'relevance', t: 'The papers were relevant to my practice', lo: 'Not at all', hi: 'Very' },
    { key: 'presentation', t: 'The presentations & critical appraisal were high quality', lo: 'Poor', hi: 'Excellent' },
    { key: 'discussion', t: 'Good discussion & chance to contribute', lo: 'Poor', hi: 'Excellent' },
    { key: 'venue', t: 'The format & venue (evening + dinner) worked well', lo: 'Poor', hi: 'Excellent' },
    { key: 'ret', t: 'Overall, I would attend again', lo: 'No', hi: 'Definitely' },
    { key: 'confidence', t: 'How confident do you feel appraising a paper?', lo: 'Not confident', hi: 'Very confident' }
  ];
  var vals = {};
  var box = document.getElementById('ratings');
  QS.forEach(function (q) {
    var d = document.createElement('div'); d.className = 'q';
    var stars = '';
    for (var i = 1; i <= 5; i++) stars += '<div class="star" data-k="' + q.key + '" data-v="' + i + '">' + i + '</div>';
    d.innerHTML = '<div class="qt">' + q.t + '</div><div class="stars">' + stars + '</div>' +
      '<div class="scale"><span>' + q.lo + '</span><span>' + q.hi + '</span></div>';
    box.appendChild(d);
  });
  box.querySelectorAll('.star').forEach(function (s) {
    s.onclick = function () {
      var k = s.dataset.k, v = +s.dataset.v; vals[k] = v;
      box.querySelectorAll('.star[data-k="' + k + '"]').forEach(function (x) { x.classList.toggle('sel', +x.dataset.v <= v); });
    };
  });

  var form = document.getElementById('fbForm'), btn = document.getElementById('submitBtn'), msg = document.getElementById('msg');
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    msg.className = 'msg'; msg.textContent = '';
    btn.disabled = true; var o = btn.textContent; btn.textContent = 'Submitting…';
    fetch(SUPABASE_URL + '/rest/v1/rpc/save_journal_club_feedback', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        p_relevance: vals.relevance || null, p_presentation: vals.presentation || null,
        p_discussion: vals.discussion || null, p_venue: vals.venue || null, p_return: vals.ret || null,
        p_confidence: vals.confidence || null,
        p_liked: document.getElementById('liked').value.trim() || null,
        p_improve: document.getElementById('improve').value.trim() || null,
        p_role: document.getElementById('role').value || null,
        p_grade: document.getElementById('grade').value.trim() || null
      })
    })
    .then(function (r) { if (!r.ok) return r.text().then(function (t) { throw new Error(t || r.status); }); })
    .then(function () { form.style.display = 'none'; document.getElementById('success').style.display = 'block'; window.scrollTo({ top: 0, behavior: 'smooth' }); })
    .catch(function (e) { btn.disabled = false; btn.textContent = o; msg.className = 'msg err'; msg.textContent = "Sorry — couldn't submit just now. Please try again."; console.error(e); });
  });
})();
</script>
</body>
</html>
